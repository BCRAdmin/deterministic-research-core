name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Compile Python
        run: python -m compileall -q research_agent

      - name: Ruff
        run: python -m ruff check research_agent

      - name: Run tests
        run: python -m coverage run -m pytest -q

      - name: Coverage report
        run: python -m coverage report
