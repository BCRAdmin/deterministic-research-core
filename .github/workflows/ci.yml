name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    env:
      GIT_OPTIONAL_LOCKS: "0"
      ROOM16_HERMETIC_CI: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Materialize hermetic companion authorities
        run: .venv/bin/python scripts/materialize_room16_ci_companions.py --repo "$GITHUB_WORKSPACE"

      - name: Install Product test dependencies
        working-directory: ../company-dossier-lab/room16-app
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Verify dependencies
        run: .venv/bin/python -m pip check

      - name: Compile Python
        run: .venv/bin/python -m compileall -q research_agent scripts

      - name: Ruff
        run: .venv/bin/python -m ruff check research_agent scripts

      - name: Test trust split
        run: .venv/bin/python -m pytest -q research_agent/tests/test_room16_test_trust_contract.py research_agent/tests/test_ba12_final_strangler_cutover.py

      - name: Test Product hermetic companion
        working-directory: ../company-dossier-lab/room16-app
        run: |
          node --test --test-concurrency=1 scripts/test_ba12_native_cutover.mjs scripts/test_ba12_r5_runtime_activation.mjs
          node --test scripts/test_compiler_artifact_bundle_v2.mjs

      - name: Audit test hermeticity
        run: .venv/bin/python scripts/audit_test_hermeticity.py --repo .

      - name: Run tests
        run: .venv/bin/python -m coverage run -m pytest -q

      - name: Coverage report
        run: .venv/bin/python -m coverage report
